  <text x="735" y="145" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Check patch</text>
  <text x="735" y="181" fill="#AFC0EF" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle">Newest app is checked</text>
  <text x="1020" y="145" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Run official CLI</text>
  <text x="1020" y="181" fill="#AFC0EF" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle">Only when needed</text>
  <line x1="294" y1="162" x2="336" y2="162" stroke="#75E2B3" stroke-width="7" stroke-linecap="round"/>
  <line x1="574" y1="162" x2="616" y2="162" stroke="#75E2B3" stroke-width="7" stroke-linecap="round"/>
  <line x1="854" y1="162" x2="896" y2="162" stroke="#75E2B3" stroke-width="7" stroke-linecap="round"/>
