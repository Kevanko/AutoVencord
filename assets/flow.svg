  <polygon points="616,162 600,151 600,173" fill="#75E2B3"/>
  <polygon points="896,162 880,151 880,173" fill="#75E2B3"/>
  <rect x="272" y="280" width="656" height="86" rx="16" fill="#111A31" stroke="#2A3968"/>
  <text x="600" y="315" fill="#9CB0FF" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Logs are written to last-action.log</text>
  <text x="600" y="348" fill="#9CB0FF" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">and rotated to last-action.previous.log</text>
