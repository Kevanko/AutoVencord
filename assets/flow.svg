<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" rx="24" fill="#0D1327"/>
  <rect x="56" y="96" width="238" height="132" rx="16" fill="#192240" stroke="#34457C"/>
  <rect x="336" y="96" width="238" height="132" rx="16" fill="#192240" stroke="#34457C"/>
  <rect x="616" y="96" width="238" height="132" rx="16" fill="#192240" stroke="#34457C"/>
  <rect x="896" y="96" width="248" height="132" rx="16" fill="#192240" stroke="#34457C"/>
  <text x="175" y="145" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Discord updates</text>
  <text x="175" y="181" fill="#AFC0EF" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle">Creates an app-* folder</text>
  <text x="455" y="145" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Watcher wakes</text>
